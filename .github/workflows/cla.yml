# Contributor License Agreement check (CLA Assistant Lite).
#
# Every pull request author must sign CLA.md once, by commenting the sign phrase on a
# pull request. Signatures are stored in this repository, on the `cla-signatures`
# branch, in signatures/version1/cla.json; nothing is kept by a third party. The
# first run creates that branch; leave it unprotected so the action can write to it.
#
# pull_request_target runs with a write token in the base repository's context: this
# workflow must never check out or run the pull request's head code, and no PR- or
# comment-supplied text may reach a `run:` step.

name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# Nothing by default; the job asks for exactly what it needs.
permissions: {}

jobs:
  cla:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create cla-signatures and write the signatures file
      pull-requests: write   # comment on the pull request and lock it
      statuses: write        # set the CLA status on the pull request's head
      actions: write         # the action re-runs this workflow's check on the PR after a sign comment
    # A comment triggers it only on a pull request, and only for the sign phrase or "recheck".
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      # The action writes signatures to an existing branch but never creates it.
      # Branch it once from the default branch; later runs find it and do nothing.
      - name: Create the signatures branch if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! gh api "repos/$REPO/branches/cla-signatures" --silent 2>/dev/null; then
            sha="$(gh api "repos/$REPO/git/ref/heads/$DEFAULT_BRANCH" --jq .object.sha)"
            gh api "repos/$REPO/git/refs" -f ref=refs/heads/cla-signatures -f sha="$sha" --silent \
              || gh api "repos/$REPO/branches/cla-signatures" --silent
          fi
      - name: CLA Assistant
        # Pinned to the full commit SHA of the v2.6.1 release.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.event.repository.default_branch }}/CLA.md
          branch: cla-signatures
          allowlist: joelpoloney,dependabot[bot],github-actions[bot],renovate[bot]
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-notsigned-prcomment: >-
            Thank you for your contribution. Before we can merge it, please read the
            [Contributor License Agreement](${{ github.server_url }}/${{ github.repository }}/blob/${{ github.event.repository.default_branch }}/CLA.md)
            and sign it by replying on this pull request with the comment below.
          lock-pullrequest-aftermerge: false
