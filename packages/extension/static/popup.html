<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Shim</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    body { width: 340px; padding: 12px; }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    #empty { padding: 18px 4px; text-align: center; }
    footer { margin-top: 10px; font-size: 12px; }
    button.link { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; cursor: pointer; text-decoration: underline; }
    .review { margin: 6px 0 2px; }
    .review ul.problems { margin: 4px 0 0; padding-left: 18px; font-size: 12px; }
    .pill.warn { background: var(--accent-soft); color: var(--accent); }
    .meta { font-size: 12px; }
    .row.actions { justify-content: flex-end; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .versions { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--border); font-size: 12px; }
    .versions .row { margin: 2px 0; }
    .bridge { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--border); font-size: 12px; }
    .bridge label { cursor: pointer; }
    .vault { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--border); font-size: 12px; }
    .vault-form { display: grid; gap: 6px; margin-top: 6px; }
    .vault-input { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 4px 8px; flex: 1; min-width: 0; }
    .status { min-height: 1.2em; }
  </style>
</head>
<body>
  <header>
    <h1>shim</h1>
    <button id="install" class="primary">install a .shim file</button>
  </header>
  <div id="list"></div>
  <div id="empty" class="muted" hidden>no shims yet. install a .shim file exported from the Shim browser or saved by Claude Code.</div>
  <section id="vault" class="vault" hidden></section>
  <section id="bridge" class="bridge"></section>
  <footer id="mode" class="muted"></footer>
  <script src="popup.js"></script>
</body>
</html>
